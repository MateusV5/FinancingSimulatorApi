kind = "web"
previewPath = "/"
title = "FinanVision"
version = "1.0.0"
id = "artifacts/finanvision"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20452

[services.development]
run = "pnpm --filter @workspace/finanvision run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/finanvision", "run", "build" ]
publicDir = "artifacts/finanvision/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20452"
BASE_PATH = "/"
